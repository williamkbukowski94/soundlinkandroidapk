name: iPhone build check
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - name: Build iPhone simulator app
        run: xcodebuild -project ios/SoundLink.xcodeproj -scheme SoundLink -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
