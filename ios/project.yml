name: SoundLink
options:
  bundleIdPrefix: app.soundlink
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  SoundLink:
    type: application
    platform: iOS
    sources: [SoundLink]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.soundlink.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: soundLInk
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Join your soundLInk music group on this Wi-Fi network.
        INFOPLIST_KEY_UIBackgroundModes: [audio]
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
